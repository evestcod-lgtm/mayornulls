name: Build NullsMod APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct URL to Null's Brawl APK (or leave blank to use artifact)"
        required: false
        default: ""
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r25c
        run: |
          echo "y" | sdkmanager "ndk;25.2.9519653"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install tools
        run: |
          sudo apt-get install -y python3-pip zipalign
          pip3 install requests
          # apktool — latest release
          APKTOOL_VER=$(curl -s https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | grep tag_name | cut -d'"' -f4 | tr -d 'v')
          wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar" -O /usr/local/bin/apktool.jar
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool
          echo "apktool version: $APKTOOL_VER"
          # uber-apk-signer
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O /usr/local/bin/signer.jar

      - name: Download or use uploaded APK
        run: |
          APK_URL="${{ github.event.inputs.apk_url }}"

          # Priority 1: explicit URL from workflow_dispatch input
          if [ -n "$APK_URL" ]; then
            echo "Downloading APK from provided URL..."
            wget -q --show-progress "$APK_URL" -O base.apk
            echo "Downloaded: $(du -sh base.apk | cut -f1)"

          # Priority 2: APK committed to repo under uploaded/
          elif [ -f uploaded/base.apk ]; then
            echo "Using committed APK from uploaded/base.apk"
            cp uploaded/base.apk base.apk

          # Priority 3: use APK uploaded as a workflow artifact named "input-apk"
          else
            echo "Trying artifact download (requires actions/download-artifact)..."
            # Check if artifact step already placed it
            if [ -f input-apk/base.apk ]; then
              cp input-apk/base.apk base.apk
            else
              echo ""
              echo "════════════════════════════════════════════════════"
              echo "  ERROR: No APK source found. Pick one of:"
              echo ""
              echo "  A) Run workflow manually and paste the APK"
              echo "     direct-download URL into the 'apk_url' field."
              echo ""
              echo "  B) Commit the APK to the repo:"
              echo "       mkdir uploaded"
              echo "       cp nulls_brawl.apk uploaded/base.apk"
              echo "       git add uploaded/base.apk && git push"
              echo ""
              echo "  Null's Brawl APK sources:"
              echo "    https://nullsbrawl.com  (official private server site)"
              echo "    https://apkpure.com — search 'Nulls Brawl'"
              echo "════════════════════════════════════════════════════"
              exit 1
            fi
          fi

          # Validate it's actually an APK (PK zip magic bytes)
          if ! file base.apk | grep -qE "Zip|APK|Java"; then
            echo "ERROR: Downloaded file doesn't look like an APK"
            file base.apk
            exit 1
          fi

          echo "APK ready: $(du -sh base.apk | cut -f1)"

      - name: Repair APK zip structure
        run: |
          sudo apt-get install -y zip -q
          zip --fixfix base.apk --out base_fixed.apk 2>/dev/null || cp base.apk base_fixed.apk
          mv base_fixed.apk base.apk

      - name: Decompile APK
        run: |
          apktool d base.apk -o decompiled --no-src -f

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Build native mod library
        run: |
          cd app
          gradle assembleRelease --no-daemon
          find . -name "libnullsmod.so" | while read f; do
            abi=$(echo "$f" | grep -oP '(arm64-v8a|armeabi-v7a|x86|x86_64)')
            mkdir -p ../decompiled/lib/$abi
            cp "$f" ../decompiled/lib/$abi/libnullsmod.so
            echo "Copied $abi/libnullsmod.so"
          done

      - name: Inject smali hooks
        run: |
          python3 patch/inject.py decompiled patch/smali_inject

      - name: Patch manifest for overlay permission
        run: |
          python3 patch/patch_manifest.py decompiled/AndroidManifest.xml

      - name: Recompile APK
        run: |
          apktool b decompiled -o patched_unsigned.apk --use-aapt2

      - name: Align APK
        run: |
          zipalign -v 4 patched_unsigned.apk patched_aligned.apk

      - name: Generate debug keystore (replace with your own for prod)
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias nullsmod \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=NullsMod, OU=Mod, O=NullsMod, L=City, S=State, C=US" \
            -storepass nullsmod123 \
            -keypass nullsmod123

      - name: Sign APK
        run: |
          java -jar /usr/local/bin/signer.jar \
            --apks patched_aligned.apk \
            --ks release.keystore \
            --ksAlias nullsmod \
            --ksKeyPass nullsmod123 \
            --ksPass nullsmod123 \
            --out signed/

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NullsMod-APK
          path: signed/*.apk
          retention-days: 7
