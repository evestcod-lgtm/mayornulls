name: Build NullsMod APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct URL to Null's Brawl APK (or leave blank to use artifact)"
        required: false
        default: ""
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r25c
        run: |
          echo "y" | sdkmanager "ndk;25.2.9519653"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install tools
        run: |
          sudo apt-get install -y python3-pip zipalign
          pip3 install requests
          # apktool
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool
          # uber-apk-signer
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O /usr/local/bin/signer.jar

      - name: Download or use uploaded APK
        run: |
          if [ -n "${{ github.event.inputs.apk_url }}" ]; then
            wget -q "${{ github.event.inputs.apk_url }}" -O base.apk
          elif [ -f uploaded/base.apk ]; then
            cp uploaded/base.apk base.apk
          else
            echo "ERROR: Provide apk_url or upload base.apk to uploaded/ folder"
            exit 1
          fi

      - name: Decompile APK
        run: |
          apktool d base.apk -o decompiled --no-src -f

      - name: Build native mod library
        run: |
          cd app
          ./gradlew assembleRelease --no-daemon
          # Copy the built .so into decompiled libs
          find . -name "libnullsmod.so" | while read f; do
            abi=$(echo "$f" | grep -oP '(arm64-v8a|armeabi-v7a|x86|x86_64)')
            mkdir -p ../decompiled/lib/$abi
            cp "$f" ../decompiled/lib/$abi/libnullsmod.so
          done

      - name: Inject smali hooks
        run: |
          python3 patch/inject.py decompiled patch/smali_inject

      - name: Patch manifest for overlay permission
        run: |
          python3 patch/patch_manifest.py decompiled/AndroidManifest.xml

      - name: Recompile APK
        run: |
          apktool b decompiled -o patched_unsigned.apk --use-aapt2

      - name: Align APK
        run: |
          zipalign -v 4 patched_unsigned.apk patched_aligned.apk

      - name: Generate debug keystore (replace with your own for prod)
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias nullsmod \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=NullsMod, OU=Mod, O=NullsMod, L=City, S=State, C=US" \
            -storepass nullsmod123 \
            -keypass nullsmod123

      - name: Sign APK
        run: |
          java -jar /usr/local/bin/signer.jar \
            --apks patched_aligned.apk \
            --ks release.keystore \
            --ksAlias nullsmod \
            --ksKeyPass nullsmod123 \
            --ksPass nullsmod123 \
            --out signed/

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NullsMod-APK
          path: signed/*.apk
          retention-days: 7
